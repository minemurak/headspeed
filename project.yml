name: HeadSpeed
options:
  bundleIdPrefix: com.minemurak
  deploymentTarget:
    iOS: "16.0"
targets:
  HeadSpeed:
    type: application
    platform: iOS
    sources:
      - path: HeadSpeed
        excludes: [PrivacyInfo.xcprivacy]
      - path: HeadSpeed/PrivacyInfo.xcprivacy
        buildPhase: resources
    scheme: {}
    info:
      path: HeadSpeed/Info.plist
      properties:
        CFBundleDisplayName: ヘッドスピード
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: スイングを240fpsで撮影し、ヘッドスピードとミート率を自動で計測します。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.minemurak.headspeed
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
